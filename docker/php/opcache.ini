; Ajuste para dev local em Windows: o volume bind-mount (D:\ -> container) torna
; stat() caro, e o opcache padrão revalida o timestamp de cada arquivo incluído
; a cada request, o que deixava cada request na casa de 9-15s. Desativando a
; revalidação automática o bytecode fica fixo em cache; rode
; `docker compose restart app` depois de alterar código PHP para recarregar.
opcache.validate_timestamps=0
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
