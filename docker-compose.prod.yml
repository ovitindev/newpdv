services:
  app:
    build:
      context: ./docker/php
    container_name: pdvloja_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=production
    depends_on:
      - db
      - redis
    networks:
      - pdvloja

  webserver:
    image: nginx:alpine
    container_name: pdvloja_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-47281}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pdvloja

  db:
    image: mariadb:11
    container_name: pdvloja_db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE:-pdvloja}
      - MARIADB_USER=${DB_USERNAME:-pdvloja}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    volumes:
      - pdvloja_db_data:/var/lib/mysql
    networks:
      - pdvloja

  redis:
    image: redis:alpine
    container_name: pdvloja_redis
    restart: unless-stopped
    networks:
      - pdvloja

networks:
  pdvloja:
    driver: bridge

volumes:
  pdvloja_db_data:
    driver: local
